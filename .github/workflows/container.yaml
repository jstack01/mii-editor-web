name: Container (manual)
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Exact version matching web/package.json
        required: true
        default: v0.1.0-preview.4
        type: string
      publish:
        description: Publish to GHCR ONLY after explicit owner approval
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: container-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/check-container-version.py
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and execute both architectures (ARM64 is emulated on this runner)
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(git show -s --format=%ct HEAD)
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" \
              --build-arg "SOURCE_DATE_EPOCH=$epoch" --build-arg "BUILD_DATE=$(git show -s --format=%cI HEAD)" -t "mii-editor-test:$arch" .
            python3 scripts/verify-container.py --image "mii-editor-test:$arch" --platform "linux/$arch"
          done
  publish:
    if: inputs.publish && github.repository == 'jstack01/mii-editor-web'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Refuse existing versions and check package access
        run: python3 scripts/check-container-version.py --remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: source
        run: |
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish the versioned multi-platform image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jstack01/mii-editor-web:${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            BUILD_DATE=${{ steps.source.outputs.created }}
          provenance: mode=min
      - name: Verify public anonymous access (fails visibly if package is still private)
        run: python3 scripts/verify-ghcr-anonymous.py --version "$VERSION" --digest "$IMAGE_DIGEST" --expected-commit "$GITHUB_SHA" --pull
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
